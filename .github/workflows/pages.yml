name: Deploy S.PDF Web

on:
  push:
    branches: [main]
    paths: ['web/**', 'assets/**', 'fetch_ocr_models.py', 'LICENSE.txt', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spdf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare verified OCR language data
        run: python fetch_ocr_models.py
      - name: Prepare pinned browser libraries
        run: python web/prepare_vendor.py
      - name: Verify PDF operations
        run: node --test web/tests/engine.test.mjs
      - name: Build static web application
        run: python web/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
